name: Deploy AI Server (FastAPI)

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy-ai-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: ✅ Checkout FastAPI 코드
        uses: actions/checkout@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 💾 Docker 캐시 설정
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: 🐳 Docker Hub 로그인
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: ⚙️ FastAPI 이미지 빌드 & 푸시 (Buildx + 캐시 적용)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ai-server:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: 🚀 EC2에 접속해서 ai-server 재시작 (개발/운영 분기)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ github.ref == 'refs/heads/dev' && secrets.DEV_EC2_HOST || secrets.EC2_HOST }}
          username: ${{ github.ref == 'refs/heads/dev' && secrets.DEV_EC2_USER || secrets.EC2_USER }}
          key: ${{ github.ref == 'refs/heads/dev' && secrets.DEV_EC2_KEY || secrets.EC2_KEY }}
          script: |
            echo "Branch: $GITHUB_REF_NAME"

            if [[ "$GITHUB_REF_NAME" == "main" ]]; then
              DEPLOY_DIR=~/my-app
            else
              DEPLOY_DIR=~/app
            fi

            cd $DEPLOY_DIR

            # 공통 ENV 파일 작성
            cat > .env <<'EOF'
            ${{ secrets.ENV_FILE }}
            EOF

            docker compose pull ai-server
            docker compose up -d ai-server
